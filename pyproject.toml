[project]
name = "visual-computing-lab"
version = "0.1.0"
description = "Progressive visual computing curriculum from 2D vision to 3D spatial simulation"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "matplotlib>=3.8.0",
    "scipy>=1.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
